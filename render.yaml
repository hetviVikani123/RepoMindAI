services:
  - type: web
    name: repomind-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # Set this to your Neon PostgreSQL connection string
      - key: LOCAL_ONLY
        value: "false"
      - key: LLM_PROVIDER
        value: "gemini"
      - key: GEMINI_MODEL
        value: "gemini-1.5-flash"
      - key: GOOGLE_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
